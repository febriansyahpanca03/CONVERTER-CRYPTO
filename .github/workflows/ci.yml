name: CI

# Menahan regresi sebelum ter-deploy. Vercel membangun dari branch main
# secara otomatis, jadi tanpa ini tidak ada satu pun langkah yang
# menjalankan lint/test sebelum kode sampai ke produksi.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Lint dibiarkan gagal HANYA kalau ada error. 8 warning yang ada
      # sekarang (aturan react-hooks v7) memang sengaja dibiarkan terlihat
      # sebagai utang teknis, jadi jangan pakai --max-warnings=0 sampai
      # semuanya benar-benar dibereskan.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  server:
    name: Backend — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test
