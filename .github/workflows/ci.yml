name: CI

# Menahan regresi sebelum ter-deploy. Vercel membangun dari branch main
# secara otomatis, jadi tanpa ini tidak ada satu pun langkah yang
# menjalankan lint/test sebelum kode sampai ke produksi.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Lint dibiarkan gagal HANYA kalau ada error. 8 warning yang ada
      # sekarang (aturan react-hooks v7) memang sengaja dibiarkan terlihat
      # sebagai utang teknis, jadi jangan pakai --max-warnings=0 sampai
      # semuanya benar-benar dibereskan.
      - name: Lint
        run: npm run lint

      # Ringkasan kegagalan sengaja diangkat jadi annotation supaya alasan
      # gagalnya kelihatan langsung di daftar checks, tanpa harus membuka
      # log mentah (yang butuh hak admin repo untuk diunduh lewat API).
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log || {
            echo "::error title=Tes frontend gagal::$(tail -c 900 /tmp/test.log | tr '\n' ' | ')"
            exit 1
          }

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log || {
            echo "::error title=Build frontend gagal::$(tail -c 900 /tmp/build.log | tr '\n' ' | ')"
            exit 1
          }

  server:
    name: Backend — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test
