# Disalin ke /etc/nginx/snippets/konverter-security.conf
#
# Nilainya harus sama persis dengan blok "headers" di vercel.json —
# situs ini disajikan dari dua tempat (VPS via nginx, dan Vercel untuk
# domain kustom), dan keduanya harus berperilaku identik.
#
# `always` dipakai supaya header tetap terkirim pada respons error
# (404/50x), bukan cuma pada respons 2xx/3xx.

# frame-ancestors 'none' + X-Frame-Options: DENY = situs tidak bisa
# di-iframe orang lain (anti-clickjacking / anti-penyamaran). Ini yang
# paling relevan untuk situs bertema keuangan.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://coin-images.coingecko.com https://assets.coingecko.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

# Catatan: Strict-Transport-Security sengaja TIDAK dipasang di sini.
# Server ini melayani HTTP biasa (domain kustom pakai HTTPS lewat Vercel),
# dan memasang HSTS di atas HTTP tidak ada efeknya selain berisiko
# mengunci pengunjung ke HTTPS yang belum tersedia di sini.
