# /etc/nginx/sites-available/konverter
# Ganti DOMAIN_KAMU dengan domainmu, atau dengan _ kalau cuma pakai IP.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_KAMU;

    root /var/www/konverter;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # Header keamanan. Nilainya sengaja dijaga sama persis dengan yang ada
    # di vercel.json supaya kedua deployment berperilaku identik.
    #
    # PENTING soal cara kerja add_header di nginx: header hanya diwarisi ke
    # location kalau location itu TIDAK punya add_header sendiri. Begitu
    # sebuah location menambahkan satu add_header (mis. Cache-Control di
    # /assets/), SEMUA add_header dari level server berhenti berlaku di
    # situ. Karena itu blok ini dipisah jadi snippet dan di-include ulang
    # di tiap location yang punya add_header sendiri.
    include /etc/nginx/snippets/konverter-security.conf;

    # Aset ber-hash aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/konverter-security.conf;
    }

    # Backend Node.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
